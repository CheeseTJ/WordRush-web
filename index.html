<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#58CC02" />
  <script>
    // 兜底：非安全上下文无法用麦克风（navigator.mediaDevices 为 undefined），http 直接升级 https。
    // 但 Capacitor 壳内 origin 已经是 https://localhost（isSecureContext 为 true），
    // 且 localhost 在正则里被放行，故不会触发跳转；这里再显式跳过壳环境以防万一。
    (function () {
      var inShell = /^https?:$/.test(location.protocol) &&
        typeof window.Capacitor !== 'undefined'
      if (inShell) return
      if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
    })()
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>WordRush · 单词闯关</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/700.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/800.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
